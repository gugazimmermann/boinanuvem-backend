version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: boinanuvem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: boinanuvem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boinanuvem"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
