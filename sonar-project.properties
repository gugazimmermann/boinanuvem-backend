# SonarQube Project Configuration
sonar.projectKey=boinanuvem
sonar.projectName=boinanuvem
sonar.projectVersion=0.0.1

# SonarQube Server Configuration
sonar.host.url=http://localhost:9000
sonar.token=sqa_be0c38cb3c5f45b5404bebff6028947d74d054db

# Source code configuration
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/*.integration.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/logs/**,**/*.d.ts,**/prisma/migrations/**

# TypeScript/JavaScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code duplication configuration
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/*.integration.spec.ts
sonar.cpd.js.minimumTokens=100
sonar.cpd.ts.minimumTokens=100

# Quality gate configuration
sonar.qualitygate.wait=true

# Coverage configuration
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/*.integration.spec.ts,**/main.ts,**/prisma/**,**/dist/**

# Language configuration
sonar.language=ts
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.sonar.json

# Analysis configuration
sonar.analysis.mode=publish
